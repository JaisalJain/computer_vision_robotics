# Ablation: ByteTrack WITHOUT its key idea. Setting track_low_thresh = track_high_thresh
# leaves no detection in (low, high), so the second, low-score association never fires and
# the tracker behaves like an IoU/Kalman SORT with ByteTrack's bookkeeping.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.25
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: True
