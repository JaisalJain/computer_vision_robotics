name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-verify:
    name: ruff + CPU pytest + static verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only dependencies
        # CI has no GPU: CPU wheels of the pinned torch/torchvision, headless OpenCV.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=2.5,<2.6" "opencv-python-headless>=5.0,<5.1" scipy matplotlib pandas pillow tqdm PyYAML pytest ruff
          python -m pip install --no-deps -e .

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest (CPU)
        run: python -m pytest -q

      - name: Static repository verification
        run: python scripts/verify_repo.py --static
